<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH_Assignment-01</title>
    <link rel="stylesheet" href="./style.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- ------------ -->

<body>
    <header>
        <!-- nav + hero -->
        <p class="outside">DevConf 2026 Landing Page Design</p>
        <!-- Navbar Section start -->
        <nav>
            <div class="logo">
                <img src="./assets/logo.png" alt="Navbar logo">
            </div>
            <div class="nav_content">
                <div class="speaker"> <p>Speakers</p> </div>
                <div class="schedule"> <p>Schedule</p> </div>
                <div class="track b"> <p>Tracks</p> </div>
                <div class="venue b"> <p>Venue</p> </div>
                <div class="blog b"> <p>Blogs</p> </div>
            </div>
            <div class="common_btn">
                <p>Register Now</p>
            </div>
        </nav>
        <!-- Navbar Section end -->

        <!-- Hero Section start -->
        <section class="hero_section_container">
            <div class="overlay">
                <h1>Code. <em>Connect</em>. Create</h1>
                <p>Join 4,000+ engineers, founders, and builders at the premier developer <br> conference of 2026. Three days of cutting-edge talks, hands-on workshops, <br> and meaningful connections.</p>
                <button class="common_btn">Register Now</button>
            </div>
        </section>
        <!-- Hero Section end -->
    </header>
    <main>
        <!-- all section + footer -->
    </main>
</body>
